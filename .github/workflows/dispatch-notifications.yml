name: Dispatch notifications

# Drains the notification outbox.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan caps
# cron jobs at once per day, and an email that waits up to 24 hours to leave
# is not a notification. GitHub Actions runs it every five minutes for free.
#
# The nightly reminder cron stays on Vercel — once a day is exactly right for
# that one, so it fits the Hobby limit.
#
# Two repository secrets are required (Settings → Secrets and variables →
# Actions):
#   APP_URL      the deployed origin, e.g. https://servicedesk.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel

on:
  schedule:
    # Every five minutes. GitHub queues scheduled runs and can delay them
    # under load, so treat this as "every five minutes or so" — the dispatcher
    # is idempotent and claims rows with SKIP LOCKED, so a late or overlapping
    # run is harmless.
    - cron: "*/5 * * * *"
  # So you can drain the queue by hand from the Actions tab.
  workflow_dispatch:

# A slow run must not stack up behind the next schedule.
concurrency:
  group: dispatch-notifications
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain the outbox
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set — add them as repository secrets."
            exit 1
          fi

          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 60 \
            "$APP_URL/api/notifications/dispatch")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP $status"
          echo "$body"

          # A 401 means the secret drifted; anything 5xx means the app is
          # unwell. Both should turn the run red rather than pass quietly.
          if [ "$status" != "200" ]; then
            echo "Dispatcher returned $status"
            exit 1
          fi
